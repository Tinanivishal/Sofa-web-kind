apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
spec:
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
      - name: frontend-app
        image: vishaltinani/sofa-frontend:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
        env:
          - name: VITE_BACKEND_URL
            valueFrom:
              secretKeyRef:
                name: frontend-secrets
                key: VITE_BACKEND_URL